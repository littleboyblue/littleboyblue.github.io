<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>内蒙华电热电厂 · 小指标竞赛大屏 v1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0e17;
  --bg-panel: #111827;
  --bg-card: #1a2235;
  --accent: #00b4d8;
  --accent2: #0077b6;
  --gold: #f59e0b;
  --silver: #94a3b8;
  --bronze: #d97706;
  --warn: #f59e0b;
  --danger: #ef4444;
  --success: #10b981;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --border: #1e293b;
  --radius: 8px;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --team-colors: #3b82f6, #ef4444, #10b981, #f59e0b;
}
html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; background: var(--bg); color: var(--text); user-select: none; }

#app {
  display: grid; grid-template-rows: 56px 1fr 52px;
  grid-template-columns: 1fr 320px;
  grid-template-areas: "topbar topbar" "main sidebar" "ctrl sidebar";
  width: 100%; height: 100%;
}
#topbar { grid-area: topbar; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #0d1520; border-bottom: 1px solid var(--border); z-index: 20; }
#main   { grid-area: main; position: relative; overflow: hidden; background: var(--bg); }
#sidebar { grid-area: sidebar; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
#ctrlbar { grid-area: ctrl; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #0d1520; border-top: 1px solid var(--border); z-index: 20; }

/* === FULLSCREEN MODE === */
#app.fullscreen #topbar   { display: none; }
#app.fullscreen #sidebar  { display: none; }
#app.fullscreen #ctrlbar  { display: none; }
#app.fullscreen { grid-template-rows: 1fr; grid-template-columns: 1fr; }
#app.fullscreen #main { grid-area: 1 / 1 / 2 / 2; }
#app.fullscreen .page-slide { inset: 0; border-radius: 0; border: none; }
#app.fullscreen .page-content { padding: 32px 40px; }

.floating-toolbar {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(13, 21, 32, 0.92); border: 1px solid var(--border);
  border-radius: 20px; padding: 8px 16px; display: none; align-items: center; gap: 12px;
  z-index: 999; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.floating-toolbar.visible { display: flex; }
.floating-toolbar.fading { opacity: 0; pointer-events: none; }
.floating-toolbar .ft-btn {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all var(--transition);
}
.floating-toolbar .ft-btn:hover { border-color: var(--accent); color: var(--accent); }
.floating-toolbar .ft-btn.play-btn {
  width: 44px; height: 44px; font-size: 18px;
  background: rgba(0, 180, 216, 0.15); border-color: var(--accent);
}
.floating-toolbar .ft-info { font-size: 12px; color: var(--text-dim); }
.floating-toolbar .ft-progress { width: 140px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.floating-toolbar .ft-progress .ft-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.floating-toolbar .ft-exit {
  background: rgba(245, 158, 11, 0.12); border: 1px solid var(--gold); color: var(--gold);
  padding: 4px 12px; border-radius: 14px; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; gap: 4px; transition: all var(--transition);
}
.floating-toolbar .ft-exit:hover { background: rgba(245, 158, 11, 0.25); }

/* === TOP BAR === */
#topbar .left { display: flex; align-items: center; gap: 16px; }
#topbar .right { display: flex; align-items: center; gap: 12px; }
#topbar .title { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 2px; }
#topbar .title .accent { color: var(--accent); }
#topbar .datetime { font-size: 14px; color: var(--text-dim); }
#topbar .info-tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
#topbar .info-tag.latest { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
#topbar .info-tag.manual { background: rgba(245, 158, 11, 0.15); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.3); }
#topbar .info-tag.editable { background: rgba(0, 180, 216, 0.12); color: var(--accent); border: 1px solid rgba(0, 180, 216, 0.25); display: none; }
.topbar-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 12px; transition: all var(--transition); display: flex; align-items: center; gap: 6px; }
.topbar-btn:hover { border-color: var(--accent); color: var(--accent); }
.topbar-btn.active { background: rgba(0, 180, 216, 0.15); border-color: var(--accent); color: var(--accent); }
.topbar-btn.fs-btn { background: rgba(245, 158, 11, 0.12); border-color: var(--gold); color: var(--gold); }

/* === SIDEBAR === */
#sidebar .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
.sidebar-tab { flex: 1; padding: 10px 6px; border: none; background: none; color: var(--text-dim); font-size: 12px; cursor: pointer; text-align: center; transition: all var(--transition); border-bottom: 2px solid transparent; }
.sidebar-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(0, 180, 216, 0.05); }
#sidebar .sidebar-content { flex: 1; overflow-y: auto; }
#sidebar .sidebar-content::-webkit-scrollbar { width: 4px; }
#sidebar .sidebar-content::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

/* -- History Tab -- */
.section-header { padding: 12px 16px 8px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); margin-bottom: 4px; font-weight: 600; letter-spacing: 1px; }
.record-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; margin: 2px 8px; border-radius: var(--radius); cursor: pointer; transition: all var(--transition); border: 1px solid transparent; }
.record-item:hover { background: var(--bg-card); border-color: var(--border); }
.record-item.active { background: rgba(0, 180, 216, 0.1); border-color: var(--accent); }
.record-item .ri-left { display: flex; flex-direction: column; gap: 2px; }
.record-item .ri-date { font-size: 13px; font-weight: 500; }
.record-item .ri-meta { font-size: 11px; color: var(--text-dim); }
.record-item .ri-actions { display: flex; gap: 4px; align-items: center; }
.record-item .ri-badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; color: #fff; white-space: nowrap; }
.record-item .ri-badge.edb { background: #10b981; }
.record-item .ri-badge.latest { background: var(--accent2); }
.record-item.active .ri-badge.latest { background: var(--accent); }
.ri-action-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
.ri-action-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0, 180, 216, 0.1); }
.btn-return-latest { width: calc(100% - 16px); margin: 8px; padding: 8px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600; border: 1px solid var(--accent); background: rgba(0, 180, 216, 0.1); color: var(--accent); transition: all var(--transition); }
.btn-return-latest:hover { background: rgba(0, 180, 216, 0.2); }
.btn-return-latest:disabled { opacity: 0.4; cursor: not-allowed; }

/* -- Data Maintenance Tab -- */
.data-panel { padding: 12px; }
.data-panel h4 { font-size: 13px; color: var(--text); margin: 12px 0 8px; }
.data-panel h4:first-child { margin-top: 0; }
.data-team-section { margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.data-team-header { padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
.data-team-header:hover { background: rgba(255,255,255,0.03); }
.data-team-body { padding: 8px 12px; border-top: 1px solid var(--border); }
.data-team-body table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-team-body th, .data-team-body td { padding: 5px 6px; text-align: center; border-bottom: 1px solid rgba(30, 41, 59, 0.5); }
.data-team-body th { color: var(--text-dim); font-weight: 500; font-size: 11px; }
.data-team-body td:first-child { text-align: left; }
.data-team-body input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 3px 6px; border-radius: 4px; font-size: 12px; width: 70px; text-align: center; transition: all var(--transition); }
.data-team-body input:focus { border-color: var(--accent); outline: none; }
.data-team-body .team-total-row { font-weight: 600; color: var(--accent); background: rgba(0, 180, 216, 0.05); }
.data-team-body .team-total-row td { padding: 8px 6px; }
.data-edited-hint { font-size: 11px; color: var(--warn); text-align: center; padding: 8px; display: none; }
.btn-submit { width: 100%; margin-top: 8px; padding: 10px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600; border: none; background: var(--accent); color: #fff; transition: all var(--transition); }
.btn-submit:hover { background: var(--accent2); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

/* -- Settings Tab -- */
.settings-panel { padding: 12px; }
.settings-panel h4 { font-size: 13px; color: var(--text); margin-bottom: 10px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.setting-row label { font-size: 12px; color: var(--text-dim); }
.setting-row select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.setting-row .bonus-input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px; width: 80px; text-align: center; }

/* === MAIN DISPLAY === */
.page-container { width: 100%; height: 100%; position: relative; }
.page-slide { position: absolute; inset: 24px; border-radius: 12px; background: var(--bg-panel); border: 1px solid var(--border); opacity: 0; transform: translateX(40px); transition: all var(--transition); display: flex; flex-direction: column; overflow: hidden; }
.page-slide.active { opacity: 1; transform: translateX(0); }
.page-slide.exit-left { opacity: 0; transform: translateX(-40px); }
.page-header { padding: 18px 24px 0; font-size: 18px; font-weight: 600; color: var(--accent); letter-spacing: 1px; }
.page-content { flex: 1; padding: 16px 24px; display: flex; gap: 16px; flex-wrap: wrap; align-content: flex-start; overflow: auto; }

/* === PAGE 1: TEAM OVERVIEW === */
.team-overview-card { flex: 1 1 calc(50% - 8px); min-width: 300px; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; display: flex; gap: 16px; align-items: center; position: relative; overflow: hidden; transition: all var(--transition); }
.team-overview-card:hover { transform: translateY(-2px); }
.team-overview-card .rank-badge { position: absolute; top: 12px; right: 16px; font-size: 48px; opacity: 0.8; }
.team-overview-card .team-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; flex-shrink: 0; }
.team-overview-card .team-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.team-overview-card .team-name { font-size: 18px; font-weight: 700; }
.team-overview-card .team-total { font-size: 36px; font-weight: 700; }
.team-overview-card .team-total .unit { font-size: 16px; color: var(--text-dim); }
.team-overview-card .team-bonus-row { display: flex; gap: 16px; font-size: 13px; }
.team-overview-card .team-bonus-row span { color: var(--text-dim); }
.team-overview-card .team-bonus-row .bonus-amount { color: var(--gold); font-weight: 600; }
.team-overview-card.rank-1 { border-color: rgba(245, 158, 11, 0.5); box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); }
.team-overview-card.rank-2 { border-color: rgba(148, 163, 184, 0.4); }
.team-overview-card.rank-3 { border-color: rgba(217, 119, 6, 0.35); }
.team-overview-card.rank-4 { border-color: var(--border); }
.team-overview-card .score-bar { height: 4px; border-radius: 2px; margin-top: 4px; }

/* === PAGE 2: ASSESSMENT DETAIL TABLE === */
.detail-table-wrap { flex: 1 1 100%; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; overflow: auto; }
.detail-table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
.detail-table-wrap th { padding: 10px 8px; text-align: center; border-bottom: 2px solid var(--border); color: var(--text-dim); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--bg-card); }
.detail-table-wrap th:first-child { text-align: left; }
.detail-table-wrap td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(30, 41, 59, 0.5); }
.detail-table-wrap td:first-child { text-align: left; font-weight: 500; }
.detail-table-wrap .score-cell { font-weight: 600; }
.detail-table-wrap .value-cell { font-size: 12px; color: var(--text-dim); }
.detail-table-wrap .total-row td { background: rgba(0, 180, 216, 0.05); font-weight: 700; font-size: 14px; border-top: 2px solid var(--accent); color: var(--accent); }
.detail-table-wrap .total-row td:first-child { color: var(--text); }

/* === PAGE 3: RANKING & BONUS === */
.ranking-section { flex: 1 1 48%; min-width: 320px; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
.ranking-section .section-title { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }
.ranking-bar-wrap { display: flex; flex-direction: column; gap: 10px; }
.ranking-bar-row { display: flex; align-items: center; gap: 12px; }
.ranking-bar-row .rank-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; }
.ranking-bar-row .rank-name { width: 70px; font-size: 13px; font-weight: 500; flex-shrink: 0; }
.ranking-bar-row .rank-bar-bg { flex: 1; height: 28px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.ranking-bar-row .rank-bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; font-weight: 600; color: #fff; transition: width 0.8s ease; }
.ranking-bar-row .rank-score { font-size: 13px; font-weight: 600; width: 50px; text-align: right; flex-shrink: 0; }

.bonus-summary { display: flex; gap: 12px; flex-wrap: wrap; }
.bonus-team-card { flex: 1 1 calc(50% - 6px); background: rgba(255,255,255,0.03); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); text-align: center; }
.bonus-team-card .bn-team { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.bonus-team-card .bn-daily { font-size: 22px; font-weight: 700; color: var(--gold); }
.bonus-team-card .bn-monthly { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.bonus-team-card .bn-monthly strong { color: var(--accent); font-size: 16px; }

/* === PAGE 4: MONTHLY TREND === */
.trend-card { flex: 1 1 100%; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.trend-card .trend-title { font-size: 14px; color: var(--text-dim); }
.trend-chart-area { flex: 1; display: flex; align-items: flex-end; gap: 4px; padding: 12px 0 4px; min-height: 140px; border-bottom: 1px solid var(--border); position: relative; }
.trend-bar-group { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; position: relative; }
.trend-bar { flex: 1; border-radius: 2px 2px 0 0; transition: height 0.6s ease; min-height: 2px; max-width: 16px; }
.trend-legend { display: flex; gap: 16px; justify-content: center; padding: 4px 0; font-size: 11px; }
.trend-legend span { display: flex; align-items: center; gap: 4px; color: var(--text-dim); }
.trend-legend .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.trend-x-labels { display: flex; gap: 4px; padding: 0 0 0 0; }
.trend-x-labels span { flex: 1; text-align: center; font-size: 10px; color: var(--text-dim); }

.monthly-table-wrap { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
.monthly-table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
.monthly-table-wrap th { padding: 10px 8px; text-align: center; border-bottom: 2px solid var(--border); color: var(--text-dim); font-weight: 500; font-size: 12px; }
.monthly-table-wrap td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(30, 41, 59, 0.5); }
.monthly-table-wrap td:first-child { text-align: left; font-weight: 600; }
.monthly-table-wrap .highlight { color: var(--gold); font-weight: 700; }

/* === CTRL BAR === */
#ctrlbar .ctrl-left { display: flex; align-items: center; gap: 12px; }
#ctrlbar .ctrl-center { display: flex; align-items: center; gap: 8px; }
#ctrlbar .ctrl-right { display: flex; align-items: center; gap: 12px; }
.ctrl-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: var(--radius); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
.ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
.ctrl-btn.play-btn { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; background: rgba(0, 180, 216, 0.15); border-color: var(--accent); }
.ctrl-label { font-size: 12px; color: var(--text-dim); }
.progress-bar { width: 180px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-bar .fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s linear; }

/* === TEXT EDITOR MODAL === */
.editor-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; }
.editor-overlay.show { display: flex; }
.editor-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.editor-panel h3 { font-size: 16px; color: var(--text); margin-bottom: 16px; }
.editor-field { margin-bottom: 12px; }
.editor-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.editor-field input, .editor-field select { width: 100%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; transition: all var(--transition); }
.editor-field input:focus, .editor-field select:focus { border-color: var(--accent); outline: none; }
.editor-field input[type="color"] { width: 52px; height: 36px; padding: 2px; cursor: pointer; }
.editor-field-row { display: flex; gap: 10px; }
.editor-field-row .editor-field { flex: 1; margin-bottom: 0; }
.editor-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
.editor-actions button { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all var(--transition); }
.btn-editor-cancel { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); }
.btn-editor-cancel:hover { border-color: var(--text-dim); }
.btn-editor-save { background: var(--accent); border: none; color: #fff; }
.btn-editor-save:hover { background: var(--accent2); }

/* === DATA EDITOR MODAL === */
.data-editor-panel {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
  width: 960px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden;
}
.data-editor-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.data-editor-header h3 { font-size: 16px; color: var(--text); }
.editor-close-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all var(--transition);
}
.editor-close-btn:hover { border-color: var(--danger); color: var(--danger); }
.data-editor-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; padding: 0 12px;
}
.data-editor-tab {
  padding: 10px 18px; border: none; background: none; color: var(--text-dim);
  font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--transition);
  border-bottom: 2px solid transparent;
}
.data-editor-tab:hover { color: var(--text); }
.data-editor-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.data-editor-body {
  flex: 1; overflow-y: auto; padding: 16px 20px;
}
.data-editor-body::-webkit-scrollbar { width: 4px; }
.data-editor-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
.data-editor-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-editor-body th {
  padding: 10px 10px; text-align: center; border-bottom: 2px solid var(--border);
  color: var(--text-dim); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--bg-panel);
}
.data-editor-body th:first-child { text-align: left; }
.data-editor-body td { padding: 8px 10px; text-align: center; border-bottom: 1px solid rgba(30,41,59,0.5); }
.data-editor-body td:first-child { text-align: left; font-weight: 500; }
.data-editor-body input {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
  padding: 5px 8px; border-radius: 4px; font-size: 13px; width: 90px; text-align: center;
  transition: all var(--transition);
}
.data-editor-body input:focus { border-color: var(--accent); outline: none; }
.data-editor-body .edit-total-row td {
  border-top: 2px solid var(--accent); background: rgba(0,180,216,0.05);
  font-weight: 700; font-size: 14px; color: var(--accent); padding: 10px;
}
.data-editor-body .edit-total-row td:first-child { color: var(--text); }
.data-editor-body .edit-max-score { font-size: 11px; color: var(--text-dim); }
.data-editor-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.data-editor-info { font-size: 12px; color: var(--text-dim); }
.data-editor-actions { display: flex; gap: 10px; }
.data-editor-actions button { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all var(--transition); }

/* === ANIMATIONS === */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.team-overview-card { animation: fadeInUp 0.5s ease both; }
.team-overview-card:nth-child(1) { animation-delay: 0.05s; }
.team-overview-card:nth-child(2) { animation-delay: 0.1s; }
.team-overview-card:nth-child(3) { animation-delay: 0.15s; }
.team-overview-card:nth-child(4) { animation-delay: 0.2s; }
.ranking-bar-row { animation: fadeInUp 0.5s ease both; }
.ranking-bar-row:nth-child(1) { animation-delay: 0.05s; }
.ranking-bar-row:nth-child(2) { animation-delay: 0.15s; }
.ranking-bar-row:nth-child(3) { animation-delay: 0.25s; }
.ranking-bar-row:nth-child(4) { animation-delay: 0.35s; }
.bonus-team-card { animation: fadeInUp 0.5s ease both; }
.bonus-team-card:nth-child(1) { animation-delay: 0.1s; }
.bonus-team-card:nth-child(2) { animation-delay: 0.2s; }
.bonus-team-card:nth-child(3) { animation-delay: 0.3s; }
.bonus-team-card:nth-child(4) { animation-delay: 0.4s; }
@keyframes growUp { from { height: 0; } }
.trend-bar { animation: growUp 0.8s ease-out both; }
.trend-bar-group:nth-child(1) .trend-bar { animation-delay: 0s; }
.trend-bar-group:nth-child(2) .trend-bar { animation-delay: 0.04s; }
.trend-bar-group:nth-child(3) .trend-bar { animation-delay: 0.08s; }
.trend-bar-group:nth-child(4) .trend-bar { animation-delay: 0.12s; }
.trend-bar-group:nth-child(5) .trend-bar { animation-delay: 0.16s; }
.trend-bar-group:nth-child(6) .trend-bar { animation-delay: 0.2s; }
.trend-bar-group:nth-child(7) .trend-bar { animation-delay: 0.24s; }

/* === TOAST === */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 2000; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.toast.success { background: rgba(16, 185, 129, 0.9); color: #fff; }
.toast.info { background: rgba(0, 180, 216, 0.9); color: #fff; }
.toast.warn { background: rgba(245, 158, 11, 0.9); color: #fff; }

/* === EDITABLE TEXT === */
.editable-text { cursor: pointer; border: 1px dashed transparent; transition: all 0.2s; padding: 2px 6px; border-radius: 4px; display: inline-block; }
.editable-text:hover { border-color: rgba(0, 180, 216, 0.5); background: rgba(0, 180, 216, 0.05); }
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="left">
      <span class="title">🏭 内蒙华电<span class="accent">·</span>热电厂</span>
      <span class="title" style="font-size:16px;color:var(--text-dim);">小指标竞赛</span>
    </div>
    <div class="right">
      <span class="info-tag editable" id="editable-tag">✏️ 可编辑</span>
      <span id="mode-badge" class="info-tag latest">📡 最新记录</span>
      <span style="font-size:13px;color:var(--text-dim);">当前：<strong id="current-record-label">--</strong></span>

      <button class="topbar-btn fs-btn" id="btn-fullscreen" title="全屏 (F)">⛶ 全屏</button>

  <section id="main">
    <div class="page-container" id="page-container"></div>
  </section>

  <aside id="sidebar">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="history">📋 历史记录</button>
      <button class="sidebar-tab" data-tab="settings">⚙ 页面设置</button>

    <div class="sidebar-content" id="sidebar-content"></div>

  <footer id="ctrlbar">
    <div class="ctrl-left">
      <button class="ctrl-btn" id="btn-prev" title="上一页 (←)">◀</button>

      <div class="progress-bar"><div class="fill" id="progress-fill" style="width:0%"></div></div>
      <span style="font-size:12px;color:var(--text-dim);" id="page-indicator">0 / 0</span>

</div>

<!-- FLOATING TOOLBAR (fullscreen mode) -->
<div class="floating-toolbar" id="floating-toolbar">
  <button class="ft-btn" id="ft-prev" title="上一页">◀</button>
  <button class="ft-btn play-btn" id="ft-play" title="播放/暂停">▶</button>
  <button class="ft-btn" id="ft-next" title="下一页">▶</button>

</div>

<!-- TEXT EDITOR MODAL -->
<div class="editor-overlay" id="editor-overlay">
  <div class="editor-panel">
    <h3>✏️ 编辑文字元素</h3>
    <div class="editor-field"><label>文字内容</label><input type="text" id="edit-content"></div>
    <div class="editor-field-row">
      <div class="editor-field"><label>字号 (px)</label><input type="number" id="edit-fontsize" min="10" max="120"></div>
      <div class="editor-field"><label>颜色</label><input type="color" id="edit-color"></div>
    </div>
    <div class="editor-field-row">
      <div class="editor-field"><label>水平位置 (px)</label><input type="number" id="edit-left" min="0" max="2000"></div>
      <div class="editor-field"><label>垂直位置 (px)</label><input type="number" id="edit-top" min="0" max="2000"></div>
    </div>
    <div class="editor-actions">
      <button class="btn-editor-cancel" id="btn-editor-cancel">取消</button>
      <button class="btn-editor-save" id="btn-editor-save">保存修改</button>
    </div>
  </div>
</div>

<!-- DATA EDITOR MODAL -->
<div class="editor-overlay" id="data-editor-overlay">
  <div class="data-editor-panel">
    <div class="data-editor-header">
      <h3 id="data-editor-title">✏️ 编辑竞赛数据</h3>
      <button class="editor-close-btn" id="btn-data-editor-close">✕</button>
    </div>
    <div class="data-editor-tabs" id="data-editor-tabs"></div>
    <div class="data-editor-body" id="data-editor-body"></div>
    <div class="data-editor-footer">
      <span class="data-editor-info" id="data-editor-info"></span>
      <div class="data-editor-actions">
        <button class="btn-editor-cancel" id="btn-data-editor-cancel">取消</button>
        <button class="btn-editor-save" id="btn-data-editor-submit">确认提交</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  DATA LAYER — 4班组小指标竞赛
// ============================================================
const STORAGE_KEY = 'daping_v2_records';
const SETTINGS_KEY = 'daping_v2_settings';
const TEAM_NAMES = ['运行一值', '运行二值', '运行三值', '运行四值'];
const TEAM_COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b'];
const TEAM_ICONS = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ'];
const BONUS_BY_RANK = [400, 300, 200, 100];
const ASSESSMENT_ITEMS = [
  { id: 'power_gen', name: '发电量', unit: '万kWh', higherBetter: true, maxScore: 150 },
  { id: 'coal_rate', name: '供电煤耗', unit: 'g/kWh', higherBetter: false, maxScore: 150 },
  { id: 'plant_rate', name: '厂用电率', unit: '%', higherBetter: false, maxScore: 100 },
  { id: 'env_index', name: '环保指标', unit: '分', higherBetter: true, maxScore: 100 },
  { id: 'safety', name: '安全运行', unit: '分', higherBetter: true, maxScore: 200 },
  { id: 'defect', name: '设备缺陷', unit: '分', higherBetter: true, maxScore: 100 },
  { id: 'operation', name: '操作规范', unit: '分', higherBetter: true, maxScore: 100 },
];
function computeMaxScore() { return ASSESSMENT_ITEMS.reduce((s, a) => s + a.maxScore, 0); }

function rand(base, spread) { return +(base + (Math.random() * spread * 2 - spread)).toFixed(1); }
function randInt(base, spread) { return Math.round(rand(base, spread)); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(id) { const [y,m,d] = id.split('-'); return `${parseInt(m)}月${parseInt(d)}日`; }

function generateTeamData(teamIdx) {
  const items = ASSESSMENT_ITEMS.map(item => ({
    id: item.id, name: item.name, value: 0, unit: item.unit, score: 0, maxScore: item.maxScore,
  }));
  items.forEach(item => {
    const def = ASSESSMENT_ITEMS.find(a => a.id === item.id);
    if (def.id === 'power_gen') { item.value = randInt(315, 15); item.score = randInt(def.maxScore - 10, 10); }
    else if (def.id === 'coal_rate') { item.value = rand(302, 3); item.score = randInt(def.maxScore - 10, 10); }
    else if (def.id === 'plant_rate') { item.value = rand(5.6, 0.5); item.score = randInt(def.maxScore - 15, 15); }
    else if (def.id === 'env_index') { item.value = randInt(def.maxScore - 5, 5); item.score = item.value; }
    else if (def.id === 'safety') { item.value = randInt(def.maxScore - 5, 5); item.score = item.value; }
    else if (def.id === 'defect') { item.value = randInt(def.maxScore - 8, 8); item.score = item.value; }
    else if (def.id === 'operation') { item.value = randInt(def.maxScore - 5, 8); item.score = item.value; }
  });
  return {
    id: 'team_' + teamIdx,
    name: TEAM_NAMES[teamIdx],
    color: TEAM_COLORS[teamIdx],
    icon: TEAM_ICONS[teamIdx],
    items,
    totalScore: 0,
    rank: 0,
    dailyBonus: 0,
    monthlyBonus: 0,
  };
}

function calcTeamTotals(team) {
  team.totalScore = team.items.reduce((sum, item) => sum + item.score, 0);
}

function rankAndBonus(teams) {
  const sorted = [...teams].sort((a, b) => b.totalScore - a.totalScore || a.name.localeCompare(b.name));
  sorted.forEach((team, i) => {
    team.rank = i + 1;
    team.dailyBonus = BONUS_BY_RANK[i];
  });
  return teams;
}

function calcMonthlyBonus(allRecords) {
  const sorted = [...allRecords].sort((a, b) => a.id.localeCompare(b.id));
  const currentMonth = sorted[sorted.length - 1]?.id?.substring(0, 7) || todayStr().substring(0, 7);
  const monthRecords = sorted.filter(r => r.id.startsWith(currentMonth));
  const totals = TEAM_NAMES.map(() => 0);
  monthRecords.forEach(r => { if (r.teams) r.teams.forEach((t, i) => { totals[i] += t.dailyBonus; }); });
  return totals;
}

function generateDailyRecord(dateStr, existingRecords) {
  const teams = [0, 1, 2, 3].map(i => generateTeamData(i));
  teams.forEach(calcTeamTotals);
  rankAndBonus(teams);

  const recMonth = dateStr.substring(0, 7);
  if (existingRecords) {
    const monthRecords = existingRecords.filter(r => r.id.startsWith(recMonth));
    const totals = TEAM_NAMES.map(() => 0);
    monthRecords.forEach(r => { if (r.teams) r.teams.forEach((t, i) => { totals[i] += t.dailyBonus; }); });
    teams.forEach((t, i) => { t.monthlyBonus = totals[i] + t.dailyBonus; });
  } else {
    const day = parseInt(dateStr.substring(8, 10)) || 1;
    teams.forEach((t, i) => { t.monthlyBonus = t.dailyBonus * day; });
  }

  return {
    id: dateStr,
    label: fmtDate(dateStr) + (dateStr === todayStr() ? '（今日）' : ''),
    generated: true,
    editableTexts: {
      'page0-title': { content: '小指标竞赛总览', fontSize: 18, color: '#00b4d8', left: 0, top: 0 },
      'page1-title': { content: '考核项目明细', fontSize: 18, color: '#00b4d8', left: 0, top: 0 },
      'page2-title': { content: '排名与奖金', fontSize: 18, color: '#00b4d8', left: 0, top: 0 },
      'page3-title': { content: '月度累计统计', fontSize: 18, color: '#00b4d8', left: 0, top: 0 },
    },
    teams,
  };
}

function loadRecords() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function loadSettings() {
  try { const r = localStorage.getItem(SETTINGS_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

function ensureRecords() {
  let records = loadRecords();
  if (!records || records.length === 0 || !records[0]?.teams) {
    records = [];
    for (let i = 29; i >= 0; i--) {
      const dateStr = daysAgo(i);
      records.push(generateDailyRecord(dateStr, records));
    }
    saveRecords(records);
  } else {
    const today = todayStr();
    if (!records.find(r => r.id === today)) {
      records.push(generateDailyRecord(today, records));
      if (records.length > 30) records.shift();
      saveRecords(records);
    }
    if (!records.find(r => r.id === daysAgo(1))) {
      records.push(generateDailyRecord(daysAgo(1), records));
      records.sort((a, b) => a.id.localeCompare(b.id));
      if (records.length > 30) records.shift();
      saveRecords(records);
    }
  }
  return records;
}

function ensureSettings() {
  let s = loadSettings();
  if (!s) { s = { pageDurations: [5, 8, 8, 5], bonusRules: [400, 300, 200, 100] }; saveSettings(s); }
  if (!s.bonusRules) { s.bonusRules = [400, 300, 200, 100]; saveSettings(s); }
  return s;
}

function updateRecord(id, updater) {
  const records = loadRecords();
  if (!records) return false;
  const idx = records.findIndex(r => r.id === id);
  if (idx === -1) return false;
  updater(records[idx]);
  recalcRecord(records[idx], records);
  saveRecords(records);
  return true;
}

function recalcRecord(record, allRecords) {
  record.teams.forEach(calcTeamTotals);
  rankAndBonus(record.teams);
  const monthlyBns = calcMonthlyBonus(allRecords);
  record.teams.forEach((t, i) => { t.monthlyBonus = monthlyBns[i]; });
}

function isRecent3(id) {
  for (let i = 0; i < 3; i++) { if (id === daysAgo(i)) return true; }
  return false;
}

// ============================================================
//  STATE
// ============================================================
let records = [];
let settings = {};
let state = {
  currentRecordId: null, currentPage: 0, isPlaying: true, isManual: false,
  activeSidebarTab: 'history', autoTimer: null, progressTimer: null,
  editingTargetId: null, dataDirty: false,
};

const $pc = document.getElementById('page-container');
const $sc = document.getElementById('sidebar-content');
const $cl = document.getElementById('current-record-label');
const $mb = document.getElementById('mode-badge');
const $et = document.getElementById('editable-tag');
const $ck = document.getElementById('clock');
const $pi = document.getElementById('page-indicator');
const $pf = document.getElementById('progress-fill');
const $ps = document.getElementById('play-status');
const $bp = document.getElementById('btn-play');
const $bpr = document.getElementById('btn-prev');
const $bnx = document.getElementById('btn-next');
const $bfs = document.getElementById('btn-fullscreen');
const $cpd = document.getElementById('current-page-duration');
const $eo = document.getElementById('editor-overlay');
const $ec = document.getElementById('edit-content');
const $efs = document.getElementById('edit-fontsize');
const $eco = document.getElementById('edit-color');
const $el = document.getElementById('edit-left');
const $etop = document.getElementById('edit-top');
const $toast = document.getElementById('toast');

function getRec() { return records.find(r => r.id === state.currentRecordId); }
function pageCount() { return 4; }
function pageDur(idx) { return settings.pageDurations[idx] || 5; }

function toast(msg, type) {
  $toast.textContent = msg; $toast.className = 'toast ' + type + ' show';
  clearTimeout($toast._t); $toast._t = setTimeout(() => { $toast.className = 'toast'; }, 2000);
}

// ============================================================
//  CLOCK
// ============================================================
function tick() { $ck.textContent = new Date().toLocaleString('zh-CN', { hour12: false }); }
setInterval(tick, 1000); tick();

// ============================================================
//  RENDER PAGES
// ============================================================
function renderPages() {
  const rec = getRec(); if (!rec) return;
  const pageTypes = ['overview', 'detail', 'ranking', 'monthly'];
  $pc.innerHTML = '';
  pageTypes.forEach((type, idx) => {
    const el = document.createElement('div');
    el.className = 'page-slide' + (idx === state.currentPage ? ' active' : '');
    el.dataset.pageIdx = idx;
    el.innerHTML = pageHTML(rec, idx);
    $pc.appendChild(el);
  });
  bindEditableEvents();
}

function pageHTML(rec, idx) {
  const titles = ['小指标竞赛总览', '考核项目明细', '排名与奖金', '月度累计统计'];
  const titleDef = rec.editableTexts ? rec.editableTexts['page' + idx + '-title'] : null;
  let headerHTML;
  if (titleDef) {
    const s = `contenteditable="false" data-text-id="page${idx}-title" style="font-size:${titleDef.fontSize}px;color:${titleDef.color};font-weight:600;letter-spacing:1px;padding:4px 8px;"`;
    headerHTML = `<span class="editable-text" ${s}>${titleDef.content}</span>`;
  } else {
    headerHTML = `<div class="page-header">${titles[idx]}</div>`;
  }
  let body = '<div class="page-content">';
  switch (idx) {
    case 0: body += overviewPage(rec); break;
    case 1: body += detailPage(rec); break;
    case 2: body += rankingPage(rec); break;
    case 3: body += monthlyPage(rec); break;
  }
  body += '</div>';
  return headerHTML + body;
}

// --- PAGE 1: 竞赛总览 ---
function overviewPage(rec) {
  const teams = [...rec.teams].sort((a, b) => a.rank - b.rank);
  const medals = ['🥇', '🥈', '🥉', '4️⃣'];
  return teams.map((t, i) => {
    const rankClass = 'rank-' + t.rank;
    return `<div class="team-overview-card ${rankClass}">
      <div class="rank-badge">${medals[i]}</div>
      <div class="team-icon" style="background:${t.color};color:#fff;">${t.icon}</div>
      <div class="team-info">
        <div class="team-name" style="color:${t.color}">${t.name}</div>
        <div class="team-total" style="color:${t.color}">${t.totalScore}<span class="unit">分</span></div>
        <div class="score-bar" style="background:${t.color};width:${(t.totalScore / computeMaxScore() * 100).toFixed(0)}%"></div>
        <div class="team-bonus-row">
          <span>日奖金 <strong class="bonus-amount">¥${t.dailyBonus}</strong></span>
          <span>月累计 <strong class="bonus-amount">¥${t.monthlyBonus}</strong></span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// --- PAGE 2: 考核明细 ---
function detailPage(rec) {
  const items = ASSESSMENT_ITEMS;
  let html = '<div class="detail-table-wrap"><table>';
  html += '<thead><tr><th>考核项目</th>';
  rec.teams.forEach(t => html += `<th style="color:${t.color}">${t.name}<br><span style="font-size:10px;color:var(--text-dim)">值 / 得分</span></th>`);
  html += '</tr></thead><tbody>';
  items.forEach(item => {
    html += `<tr><td>${item.name}<br><span style="font-size:10px;color:var(--text-dim)">${item.unit}</span></td>`;
    rec.teams.forEach(t => {
      const d = t.items.find(i => i.id === item.id);
      const scoreClass = d.score >= d.maxScore * 0.95 ? 'var(--success)' : d.score >= d.maxScore * 0.85 ? 'var(--warn)' : 'var(--danger)';
      html += `<td><span class="value-cell">${d.value} ${item.unit}</span><br><span class="score-cell" style="color:${scoreClass}">${d.score}/${item.maxScore} 分</span></td>`;
    });
    html += '</tr>';
  });
  html += '<tr class="total-row"><td>总得分</td>';
  rec.teams.forEach(t => html += `<td style="color:${t.color}">${t.totalScore} 分</td>`);
  html += '</tr></tbody></table></div>';
  return html;
}

// --- PAGE 3: 排名与奖金 ---
function rankingPage(rec) {
  const sorted = [...rec.teams].sort((a, b) => a.rank - b.rank);
  const maxScore = Math.max(...sorted.map(t => t.totalScore), 1);
  const rankColors = ['#f59e0b', '#94a3b8', '#d97706', '#475569'];
  const rankMedals = ['🥇', '🥈', '🥉', '④'];

  let html = '<div class="ranking-section"><div class="section-title">🏆 综合排名</div><div class="ranking-bar-wrap">';
  sorted.forEach((t, i) => {
    const pct = (t.totalScore / maxScore * 100).toFixed(0);
    html += `<div class="ranking-bar-row">
      <span class="rank-num" style="background:${rankColors[i]}">${rankMedals[i]}</span>
      <span class="rank-name">${t.name}</span>
      <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%;background:${t.color}">${t.totalScore}分</div></div>
    </div>`;
  });
  html += '</div></div>';

  html += '<div class="ranking-section"><div class="section-title">💰 奖金分配</div><div class="bonus-summary">';
  sorted.forEach(t => {
    html += `<div class="bonus-team-card">
      <div class="bn-team" style="color:${t.color}">${t.name}</div>
      <div class="bn-daily">¥${t.dailyBonus}</div>
      <div style="font-size:11px;color:var(--text-dim)">日奖金</div>
      <div class="bn-monthly">月累计：<strong>¥${t.monthlyBonus}</strong></div>
    </div>`;
  });
  html += '</div></div>';
  return html;
}

// --- PAGE 4: 月度趋势 ---
function monthlyPage(rec) {
  const recMonth = rec.id.substring(0, 7);
  const monthRecs = records.filter(r => r.id.startsWith(recMonth)).sort((a, b) => a.id.localeCompare(b.id));
  const totalMax = computeMaxScore();

  let html = '<div class="trend-card"><div class="trend-title">📈 本月各值日总得分趋势</div>';
  html += '<div class="trend-chart-area">';
  monthRecs.forEach((r) => {
    html += '<div class="trend-bar-group">';
    rec.teams.forEach((t) => {
      const otherTeam = r.teams ? r.teams.find(ot => ot.name === t.name) : null;
      const val = otherTeam ? otherTeam.totalScore : 600;
      const h = Math.max(4, (val / totalMax) * 100);
      html += `<div class="trend-bar" style="height:${h}%;background:${t.color}"></div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="trend-legend">';
  rec.teams.forEach(t => html += `<span><span class="legend-dot" style="background:${t.color}"></span>${t.name}</span>`);
  html += '</div>';
  html += '<div class="trend-x-labels">';
  monthRecs.forEach(r => html += `<span>${parseInt(r.id.substring(8, 10))}日</span>`);
  html += '</div></div>';

  html += '<div class="monthly-table-wrap"><div class="trend-title" style="margin-bottom:10px;">💵 本月奖金累计</div><table>';
  html += '<thead><tr><th>班组</th><th>日奖金</th><th>月累计奖金</th><th>月排名</th></tr></thead><tbody>';
  const sorted = [...rec.teams].sort((a, b) => b.monthlyBonus - a.monthlyBonus);
  sorted.forEach((t, i) => {
    html += `<tr>
      <td style="color:${t.color};font-weight:600">${t.name}</td>
      <td class="highlight">¥${t.dailyBonus}</td>
      <td class="highlight">¥${t.monthlyBonus}</td>
      <td>${i + 1}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  return html;
}

// ============================================================
function bindEditableEvents() {
  document.querySelectorAll('.editable-text').forEach(el => {
    el.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      if (!isRecent3(state.currentRecordId)) { toast('⚠ 仅近3天记录支持编辑', 'warn'); return; }
      openEditor(el);
    });
  });
}

function openEditor(el) {
  const tid = el.dataset.textId;
  const rec = getRec(); if (!rec || !rec.editableTexts || !rec.editableTexts[tid]) return;
  const d = rec.editableTexts[tid];
  state.editingTargetId = tid;
  $ec.value = d.content; $efs.value = d.fontSize; $eco.value = d.color || '#00b4d8';
  $el.value = d.left; $etop.value = d.top;
  $eo.classList.add('show');
}
function closeEditor() { $eo.classList.remove('show'); state.editingTargetId = null; }
function saveTextEdit() {
  const rec = getRec(); if (!rec || !state.editingTargetId) return;
  const d = rec.editableTexts[state.editingTargetId]; if (!d) return;
  if (!rec.editableTexts) rec.editableTexts = {};
  d.content = $ec.value; d.fontSize = parseInt($efs.value) || 18;
  d.color = $eco.value; d.left = parseInt($el.value) || 28; d.top = parseInt($etop.value) || 20;
  updateRecord(rec.id, (r) => { r.editableTexts = rec.editableTexts; });
  records = loadRecords();
  renderPages(); closeEditor();
  toast('✓ 文字修改已保存', 'success');
}
document.getElementById('btn-editor-save').addEventListener('click', saveTextEdit);
document.getElementById('btn-editor-cancel').addEventListener('click', closeEditor);
$eo.addEventListener('click', (e) => { if (e.target === $eo) closeEditor(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($eo.classList.contains('show')) { closeEditor(); } else if ($deo.classList.contains('show')) { closeDataEditor(); } } });

// ============================================================
//  DATA EDITOR MODAL
// ============================================================
var $deo = document.getElementById('data-editor-overlay');
var $detitle = document.getElementById('data-editor-title');
var $detabs = document.getElementById('data-editor-tabs');
var $debody = document.getElementById('data-editor-body');
var $deinfo = document.getElementById('data-editor-info');
var dataEditorRecordId = null;
var dataEditorTeamIdx = 0;

function openDataEditor(id) {
  var rec = records.find(function(r) { return r.id === id; });
  if (!rec || !rec.teams) { toast('⚠ 数据异常', 'warn'); return; }
  dataEditorRecordId = id;
  dataEditorTeamIdx = 0;
  $detitle.textContent = '✏️ 编辑竞赛数据 — ' + rec.label;
  renderEditorTabs(rec);
  renderEditorBody(rec);
  $deo.classList.add('show');
}

function closeDataEditor() {
  $deo.classList.remove('show');
  dataEditorRecordId = null;
}

function renderEditorTabs(rec) {
  var html = '';
  rec.teams.forEach(function(t, i) {
    html += '<button class="data-editor-tab' + (i === dataEditorTeamIdx ? ' active' : '') + '" data-eti="' + i + '" style="color:' + (i === dataEditorTeamIdx ? 'var(--accent)' : t.color) + '">' + t.icon + ' ' + t.name + '</button>';
  });
  $detabs.innerHTML = html;
  $detabs.querySelectorAll('.data-editor-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      dataEditorTeamIdx = parseInt(this.dataset.eti);
      var rec = records.find(function(r) { return r.id === dataEditorRecordId; });
      if (rec) { renderEditorTabs(rec); renderEditorBody(rec); liveCalcEditorTotal(); }
    });
  });
}

function renderEditorBody(rec) {
  var team = rec.teams[dataEditorTeamIdx];
  if (!team) return;
  var html = '<table><thead><tr><th>考核项目</th><th>数值</th><th>得分（满分）</th></tr></thead><tbody>';
  team.items.forEach(function(item) {
    html += '<tr>';
    html += '<td>' + item.name + ' <span class="edit-max-score">' + item.unit + '</span></td>';
    html += '<td><input type="number" data-editor-team="' + dataEditorTeamIdx + '" data-editor-item="' + item.id + '" data-editor-field="value" value="' + item.value + '" step="0.1"></td>';
    html += '<td><input type="number" data-editor-team="' + dataEditorTeamIdx + '" data-editor-item="' + item.id + '" data-editor-field="score" value="' + item.score + '" step="1" min="0" max="' + item.maxScore + '"> <span class="edit-max-score">/ ' + item.maxScore + '</span></td>';
    html += '</tr>';
  });
  html += '<tr class="edit-total-row"><td>合计</td><td>—</td><td><strong id="editor-live-total">' + team.totalScore + '</strong> / ' + computeMaxScore() + ' 分</td></tr>';
  html += '</tbody></table>';
  $debody.innerHTML = html;

  $debody.querySelectorAll('input[data-editor-team]').forEach(function(inp) {
    inp.addEventListener('input', liveCalcEditorTotal);
  });
  updateEditorInfo(rec);
}

function liveCalcEditorTotal() {
  var $total = document.getElementById('editor-live-total');
  if (!$total) return;
  var inputs = $debody.querySelectorAll('input[data-editor-team="' + dataEditorTeamIdx + '"][data-editor-field="score"]');
  var sum = 0;
  inputs.forEach(function(inp) { var v = parseInt(inp.value); if (!isNaN(v)) sum += v; });
  $total.textContent = sum;
}

function updateEditorInfo(rec) {
  var team = rec.teams[dataEditorTeamIdx];
  if (!team) { $deinfo.textContent = ''; return; }
  $deinfo.textContent = '总分满分: ' + computeMaxScore() + ' | 当前排名: 第' + team.rank + '名 | 日奖金: ¥' + team.dailyBonus;
}

// Submit editor
document.getElementById('btn-data-editor-submit').addEventListener('click', function() {
  var rec = records.find(function(r) { return r.id === dataEditorRecordId; });
  if (!rec) return;
  try {
    $debody.querySelectorAll('input[data-editor-team]').forEach(function(inp) {
      var ti = parseInt(inp.dataset.editorTeam);
      var itemId = inp.dataset.editorItem;
      var field = inp.dataset.editorField;
      var val = parseFloat(inp.value);
      if (isNaN(val)) return;
      var team = rec.teams[ti];
      if (!team || !team.items) return;
      var item = team.items.find(function(i) { return i.id === itemId; });
      if (item) item[field] = val;
    });

    var ok = updateRecord(rec.id, function(r) { r.teams = rec.teams; });
    if (!ok) { toast('⚠ 保存失败', 'warn'); return; }
    records = loadRecords();
    toast('✓ 竞赛数据已提交，排名与奖金自动重算', 'success');
    renderPages();
    closeDataEditor();
    renderHistoryTab();
  } catch(e) {
    console.error('Editor submit error:', e);
    toast('⚠ 保存出错，请重试', 'warn');
  }
});

document.getElementById('btn-data-editor-cancel').addEventListener('click', closeDataEditor);
document.getElementById('btn-data-editor-close').addEventListener('click', closeDataEditor);
$deo.addEventListener('click', function(e) { if (e.target === $deo) closeDataEditor(); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && $deo.classList.contains('show') && !$eo.classList.contains('show')) {
    closeDataEditor();
  }
});

// ============================================================
//  PAGE SETTINGS TAB
// ============================================================
function renderSettingsTab() {
  const titles = ['竞赛总览', '考核明细', '排名奖金', '月度累计'];
  let html = '<div class="settings-panel"><h4>⚙ 每页停留时长</h4>';
  titles.forEach((title, idx) => {
    const dur = settings.pageDurations[idx] || 5;
    html += `<div class="setting-row">
      <label>第${idx + 1}页：${title}</label>
      <select data-idx="${idx}" class="dur-select">
        <option value="3" ${dur===3?'selected':''}>3秒</option>
        <option value="5" ${dur===5?'selected':''}>5秒</option>
        <option value="8" ${dur===8?'selected':''}>8秒</option>
        <option value="10" ${dur===10?'selected':''}>10秒</option>
        <option value="15" ${dur===15?'selected':''}>15秒</option>
        <option value="30" ${dur===30?'selected':''}>30秒</option>
      </select>
    </div>`;
  });
  html += '<h4 style="margin-top:16px;">💰 排名奖金规则</h4>';
  BONUS_BY_RANK.forEach((bonus, idx) => {
    html += `<div class="setting-row">
      <label>第${idx+1}名 日奖金</label>
      <span style="display:flex;align-items:center;gap:4px;">¥ <input type="number" class="bonus-input bonus-rule-input" data-idx="${idx}" value="${bonus}" min="0" step="10"></span>
    </div>`;
  });
  html += '</div>';
  $sc.innerHTML = html;
  $sc.querySelectorAll('.dur-select').forEach(sel => {
    sel.addEventListener('change', () => {
      settings.pageDurations[parseInt(sel.dataset.idx)] = parseInt(sel.value);
      saveSettings(settings);
      updateCurDur();
      if (state.isPlaying) startAuto();
      toast('✓ 停留时长已更新', 'info');
    });
  });
  $sc.querySelectorAll('.bonus-rule-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const idx = parseInt(inp.dataset.idx);
      const val = parseInt(inp.value) || 0;
      BONUS_BY_RANK[idx] = val;
      settings.bonusRules = [...BONUS_BY_RANK];
      saveSettings(settings);
      toast('✓ 奖金规则已更新，切换记录后生效', 'info');
    });
  });
}

// ============================================================
//  HISTORY TAB
// ============================================================
function renderHistoryTab() {
  const sorted = [...records].sort((a, b) => b.id.localeCompare(a.id));
  let html = '<div class="section-header">📋 最近30天记录</div>';
  sorted.forEach(r => {
    const active = r.id === state.currentRecordId;
    const ed = isRecent3(r.id);
    const latest = r.id === records[records.length - 1]?.id;
    html += `<div class="record-item${active ? ' active' : ''}" data-id="${r.id}">
      <div class="ri-left"><span class="ri-date">${r.label}</span><span class="ri-meta">${r.teams ? r.teams.length : 4}个班组</span></div>
      <div class="ri-actions">
        ${ed ? '<span class="ri-badge edb">可编辑</span>' : ''}
        ${latest ? '<span class="ri-badge latest">最新</span>' : ''}
        ${ed ? '<button class="ri-action-btn" data-action="edit" data-id="' + r.id + '" title="编辑数据">✏️</button>' : ''}
        <button class="ri-action-btn" data-action="shot" data-id="${r.id}" title="截屏">📷</button>
      </div></div>`;
  });
  html += `<button class="btn-return-latest" id="btn-return-latest" ${state.isManual ? '' : 'disabled'}>⬆ 返回最新记录</button>`;
  $sc.innerHTML = html;
  $sc.querySelectorAll('.record-item').forEach(el => {
    el.addEventListener('click', (e) => { if (e.target.closest('[data-action]')) return; selectRecord(el.dataset.id); });
  });
  $sc.querySelectorAll('[data-action="shot"]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); captureShot(btn.dataset.id); });
  });
  $sc.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); openDataEditor(btn.dataset.id); });
  });
  const $r = document.getElementById('btn-return-latest');
  if ($r) $r.addEventListener('click', returnLatest);
}

function selectRecord(id) {
  if (id === state.currentRecordId) return;
  state.currentRecordId = id; state.currentPage = 0; state.dataDirty = false;
  state.isManual = id !== records[records.length - 1]?.id;
  if (state.isManual) { state.isPlaying = false; stopAuto(); }
  else { state.isPlaying = true; }
  updateAll();
}

function returnLatest() {
  const latest = records[records.length - 1];
  if (latest) selectRecord(latest.id);
}

async function captureShot(id) {
  const orig = state.currentRecordId;
  if (id !== orig) {
    state.currentRecordId = id; state.currentPage = 0;
    state.isPlaying = false; stopAuto();
    renderPages(); await new Promise(r => setTimeout(r, 500));
  }
  const slide = $pc.querySelector('.page-slide.active');
  if (!slide) { toast('⚠ 截屏失败', 'warn'); return; }
  try {
    const canvas = await html2canvas(slide, { backgroundColor: '#111827', scale: 2, useCORS: true });
    const a = document.createElement('a'); a.download = `竞赛截屏_${id}.png`;
    a.href = canvas.toDataURL('image/png'); a.click();
    toast('✓ 截屏已保存', 'success');
  } catch(e) { toast('⚠ 截屏失败', 'warn'); }
  if (id !== orig) {
    state.currentRecordId = orig; state.isPlaying = true; updateAll();
  }
}

// ============================================================
//  SIDEBAR TABS
// ============================================================
function switchTab(tab) {
  state.activeSidebarTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'history') renderHistoryTab();
  else if (tab === 'settings') renderSettingsTab();
}
document.querySelectorAll('.sidebar-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

// ============================================================
//  NAVIGATION & PLAYBACK
// ============================================================
function goPage(idx) {
  const c = pageCount(); if (c === 0) return;
  const ni = ((idx % c) + c) % c; if (ni === state.currentPage) return;
  const slides = $pc.children;
  if (slides[state.currentPage]) { slides[state.currentPage].classList.remove('active'); slides[state.currentPage].classList.add('exit-left'); }
  if (slides[ni]) { slides[ni].classList.remove('exit-left'); slides[ni].classList.add('active'); }
  state.currentPage = ni; updatePageIndicator(); updateCurDur(); resetProg(); bindEditableEvents();
  updateFTOnPageChange();
}
function nextPage() { goPage(state.currentPage + 1); }
function prevPage() { goPage(state.currentPage - 1); }
function updatePageIndicator() { $pi.textContent = (state.currentPage + 1) + ' / ' + pageCount(); }
function updateCurDur() { $cpd.textContent = pageDur(state.currentPage) + 's'; }
function togglePlay() { state.isPlaying = !state.isPlaying; updatePlayUI(); if (state.isPlaying) startAuto(); else stopAuto(); updateFTOnPageChange(); }
function updatePlayUI() {
  $bp.textContent = state.isPlaying ? '⏸' : '▶';
  $ps.textContent = state.isPlaying ? '▶ 播放中' : '⏸ 已暂停';
  $ps.style.color = state.isPlaying ? 'var(--success)' : 'var(--warn)';
}
function startAuto() { stopAuto(); if (!state.isPlaying) return; resetProg(); state.autoTimer = setInterval(nextPage, pageDur(state.currentPage) * 1000); }
function stopAuto() { if (state.autoTimer) { clearInterval(state.autoTimer); state.autoTimer = null; } if (state.progressTimer) { clearInterval(state.progressTimer); state.progressTimer = null; } }
function resetProg() { if (state.progressTimer) clearInterval(state.progressTimer); $pf.style.transition = 'none'; $pf.style.width = '0%'; const d = pageDur(state.currentPage); requestAnimationFrame(() => { requestAnimationFrame(() => { $pf.style.transition = `width ${d}s linear`; $pf.style.width = '100%'; }); }); }

// ============================================================
//  FULLSCREEN (CSS-based, main display only)
// ============================================================
var $app = document.getElementById('app');
var $ft = document.getElementById('floating-toolbar');
var $ftPlay = document.getElementById('ft-play');
var $ftPrev = document.getElementById('ft-prev');
var $ftNext = document.getElementById('ft-next');
var $ftStatus = document.getElementById('ft-status');
var $ftFill = document.getElementById('ft-fill');
var $ftPage = document.getElementById('ft-page');
var $ftExit = document.getElementById('ft-exit');
var ftHideTimer = null;

function toggleFS() {
  if ($app.classList.contains('fullscreen')) {
    exitFS();
  } else {
    enterFS();
  }
}

function enterFS() {
  $app.classList.add('fullscreen');
  $bfs.classList.add('active');
  $bfs.innerHTML = '⛶ 退出全屏';
  $ft.classList.add('visible', 'fading');
  syncFloatingToolbar();
  document.addEventListener('mousemove', onFSMouseMove);
}

function exitFS() {
  $app.classList.remove('fullscreen');
  $bfs.classList.remove('active');
  $bfs.innerHTML = '⛶ 全屏';
  $ft.classList.remove('visible');
  clearTimeout(ftHideTimer);
  document.removeEventListener('mousemove', onFSMouseMove);
}

function onFSMouseMove() {
  showFloatingToolbar();
  resetAutoHideFT();
}

function showFloatingToolbar() {
  $ft.classList.remove('fading');
}

function resetAutoHideFT() {
  clearTimeout(ftHideTimer);
  ftHideTimer = setTimeout(function() {
    $ft.classList.add('fading');
  }, 4000);
}

function syncFloatingToolbar() {
  $ftPlay.textContent = state.isPlaying ? '⏸' : '▶';
  $ftStatus.textContent = state.isPlaying ? '▶ 播放中' : '⏸ 已暂停';
  $ftStatus.style.color = state.isPlaying ? 'var(--success)' : 'var(--warn)';
  $ftPage.textContent = (state.currentPage + 1) + ' / ' + pageCount();
  $ftFill.style.transition = 'none';
  $ftFill.style.width = '0%';
  var d = pageDur(state.currentPage);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      $ftFill.style.transition = 'width ' + d + 's linear';
      $ftFill.style.width = '100%';
    });
  });
}

$ftPlay.addEventListener('click', function() {
  togglePlay();
  syncFloatingToolbar();
});
$ftPrev.addEventListener('click', function() { prevPage(); syncFloatingToolbar(); });
$ftNext.addEventListener('click', function() { nextPage(); syncFloatingToolbar(); });
$ftExit.addEventListener('click', exitFS);

function updateFTOnPageChange() {
  if ($app.classList.contains('fullscreen')) {
    $ftPage.textContent = (state.currentPage + 1) + ' / ' + pageCount();
    $ftPlay.textContent = state.isPlaying ? '⏸' : '▶';
    $ftStatus.textContent = state.isPlaying ? '▶ 播放中' : '⏸ 已暂停';
    $ftStatus.style.color = state.isPlaying ? 'var(--success)' : 'var(--warn)';
    $ftFill.style.transition = 'none';
    $ftFill.style.width = '0%';
    var d = pageDur(state.currentPage);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        $ftFill.style.transition = 'width ' + d + 's linear';
        $ftFill.style.width = '100%';
      });
    });
  }
}

// ============================================================
//  UI UPDATE
// ============================================================
function updateMode() {
  if (state.isManual) { $mb.textContent = '⚠ 手动选择'; $mb.className = 'info-tag manual'; }
  else { $mb.textContent = '📡 最新记录'; $mb.className = 'info-tag latest'; }
  $cl.textContent = getRec()?.label || '--';
  $et.style.display = isRecent3(state.currentRecordId) ? 'inline-block' : 'none';
}
function updateAll() {
  renderPages(); updatePageIndicator(); updatePlayUI(); updateCurDur(); updateMode();
  if (state.isPlaying) startAuto(); else stopAuto();
  if (!state.isPlaying) { $pf.style.transition = 'none'; $pf.style.width = '0%'; }
  switchTab(state.activeSidebarTab);
}

// ============================================================
//  EVENTS
// ============================================================
$bp.addEventListener('click', togglePlay);
$bpr.addEventListener('click', prevPage);
$bnx.addEventListener('click', nextPage);
$bfs.addEventListener('click', toggleFS);
document.addEventListener('keydown', (e) => {
  if ($eo.classList.contains('show')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nextPage(); }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFS(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (state.isPlaying) startAuto(); } });

// Auto-check for new daily record every 60s
setInterval(() => {
  const nr = ensureRecords();
  if (nr.length !== records.length || nr[nr.length-1]?.id !== records[records.length-1]?.id) {
    records = nr;
    if (!state.isManual) { state.currentRecordId = records[records.length-1].id; state.currentPage = 0; renderPages(); }
    if (state.activeSidebarTab === 'history') renderHistoryTab();
  }
}, 60000);

// ============================================================
//  INIT
// ============================================================
records = ensureRecords();
settings = ensureSettings();
BONUS_BY_RANK.splice(0, BONUS_BY_RANK.length, ...settings.bonusRules);
state.currentRecordId = records[records.length - 1].id;
updateAll();
</script>
</body>
</html>
